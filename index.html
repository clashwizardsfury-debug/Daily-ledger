<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense & Profit Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
        }

        .date-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Modal / Custom Calendar Style */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .calendar-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cal-title {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }

        .cal-nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .cal-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            background: #0f172a;
            border: 1px solid transparent;
            padding: 2px;
        }

        .day-cell:hover {
            border-color: #38bdf8;
        }

        .day-cell.selected {
            background: #0284c7;
            color: #fff;
        }

        .day-cell.empty {
            background: transparent;
            cursor: default;
        }

        .day-num {
            font-size: 13px;
            font-weight: 600;
        }

        .day-profit {
            font-size: 9px;
            font-weight: 700;
            margin-top: 2px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .day-profit.profit-pos { color: #4ade80; }
        .day-profit.profit-neg { color: #f87171; }

        .day-cell.selected .day-profit {
            color: #ffffff !important;
        }

        .cal-footer {
            margin-top: 16px;
            text-align: right;
        }

        .close-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .total-card {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }

        .total-card.loss-bg {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        }

        .total-card p {
            font-size: 13px;
            color: #bae6fd;
            text-transform: uppercase;
            font-weight: 600;
        }

        .total-card.loss-bg p {
            color: #fecaca;
        }

        .total-card h2 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 4px;
        }

        .input-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-field {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        .btn-add {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .list-header {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .item-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .item-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .item-profit {
            font-size: 15px;
            font-weight: 700;
        }

        .item-profit.pos { color: #4ade80; }
        .item-profit.neg { color: #f87171; }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-size: 13px;
        }

        /* Confirmation Modal */
        .confirm-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            border: 1px solid #334155;
            text-align: center;
        }

        .confirm-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .confirm-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-cancel {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Accounts Ledger</h1>
        <button class="date-btn" id="open-cal-btn">📅 <span id="selected-date-text"></span></button>
    </div>

    <div class="total-card" id="total-card-box">
        <p id="total-card-title">Selected Day's Total Profit</p>
        <h2 id="total-profit">$0.00</h2>
    </div>

    <form id="entry-form" class="input-form">
        <div class="input-row">
            <input type="text" id="item-name" class="input-field" placeholder="Item (e.g., 5× RP)" required style="flex: 2;">
            <input type="number" step="any" id="item-profit" class="input-field" placeholder="Profit/Loss (-$)" required style="flex: 1;">
        </div>
        <button type="submit" class="btn-add">Add Entry</button>
    </form>

    <div class="list-header">
        <span>Item Description</span>
        <span>Profit / Loss</span>
    </div>

    <ul id="item-list" class="item-list"></ul>
</div>

<!-- Calendar Modal -->
<div class="modal" id="cal-modal">
    <div class="calendar-card">
        <div class="cal-header">
            <button class="cal-nav-btn" id="prev-month">❮</button>
            <div class="cal-title" id="cal-month-year"></div>
            <button class="cal-nav-btn" id="next-month">❯</button>
        </div>
        <div class="cal-weekdays">
            <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>
        <div class="cal-days" id="cal-days-container"></div>
        <div class="cal-footer">
            <button class="close-btn" id="close-cal-btn">Close</button>
        </div>
    </div>
</div>

<!-- Confirm Delete Modal -->
<div class="modal" id="confirm-modal">
    <div class="confirm-card">
        <h3>Are you sure?</h3>
        <p>This entry will be permanently deleted.</p>
        <div class="confirm-actions">
            <button class="btn-cancel" id="cancel-delete-btn">Cancel</button>
            <button class="btn-confirm-delete" id="confirm-delete-btn">Delete</button>
        </div>
    </div>
</div>

<script>
    let currentDate = new Date();
    let selectedDateStr = formatDateKey(currentDate);
    let itemToDeleteId = null;

    const openCalBtn = document.getElementById('open-cal-btn');
    const closeCalBtn = document.getElementById('close-cal-btn');
    const calModal = document.getElementById('cal-modal');
    const calMonthYear = document.getElementById('cal-month-year');
    const calDaysContainer = document.getElementById('cal-days-container');
    const selectedDateText = document.getElementById('selected-date-text');

    const confirmModal = document.getElementById('confirm-modal');
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

    const form = document.getElementById('entry-form');
    const itemNameInput = document.getElementById('item-name');
    const itemProfitInput = document.getElementById('item-profit');
    const itemList = document.getElementById('item-list');
    const totalProfitEl = document.getElementById('total-profit');
    const totalCardBox = document.getElementById('total-card-box');
    const totalCardTitle = document.getElementById('total-card-title');

    function formatDateKey(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function updateSelectedDateDisplay() {
        const options = { month: 'short', day: 'numeric', year: 'numeric' };
        const parts = selectedDateStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        selectedDateText.textContent = d.toLocaleDateString('en-US', options);
    }

    openCalBtn.addEventListener('click', () => {
        renderCalendar(currentDate);
        calModal.classList.add('active');
    });

    closeCalBtn.addEventListener('click', () => {
        calModal.classList.remove('active');
    });

    // Fix 1: Date overflow issue fix on month navigation
    document.getElementById('prev-month').addEventListener('click', () => {
        currentDate.setDate(1);
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar(currentDate);
    });

    document.getElementById('next-month').addEventListener('click', () => {
        currentDate.setDate(1);
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar(currentDate);
    });

    // Fix 7: Safe LocalStorage retrieval using try-catch
    function getEntriesByDate(dateStr) {
        const data = localStorage.getItem('daily_accounts_' + dateStr);
        if (!data) return [];
        try {
            const parsed = JSON.parse(data);
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    function saveEntriesByDate(dateStr, entries) {
        localStorage.setItem('daily_accounts_' + dateStr, JSON.stringify(entries));
    }

    function calculateTotalForDate(dateStr) {
        const entries = getEntriesByDate(dateStr);
        return entries.reduce((sum, item) => sum + item.profit, 0);
    }

    function renderCalendar(date) {
        calDaysContainer.innerHTML = '';
        const year = date.getFullYear();
        const month = date.getMonth();

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        calMonthYear.textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            calDaysContainer.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const entries = getEntriesByDate(cellDateStr);
            const totalProfit = calculateTotalForDate(cellDateStr);

            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell';
            if (cellDateStr === selectedDateStr) {
                dayCell.classList.add('selected');
            }

            let profitHTML = '';
            if (entries.length > 0) {
                const isNeg = totalProfit < 0;
                const signClass = isNeg ? 'profit-neg' : 'profit-pos';
                profitHTML = `<div class="day-profit ${signClass}">$${totalProfit.toFixed(0)}</div>`;
            }

            dayCell.innerHTML = `
                <div class="day-num">${day}</div>
                ${profitHTML}
            `;

            dayCell.addEventListener('click', () => {
                selectedDateStr = cellDateStr;
                // Fix 3: Synchronize currentDate with selectedDate
                currentDate = new Date(year, month, day);
                updateSelectedDateDisplay();
                loadEntries();
                calModal.classList.remove('active');
            });

            calDaysContainer.appendChild(dayCell);
        }
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = itemNameInput.value.trim();
        const profit = parseFloat(itemProfitInput.value);

        if (!name || isNaN(profit)) return;

        const entries = getEntriesByDate(selectedDateStr);
        entries.push({ id: Date.now(), name, profit });
        
        saveEntriesByDate(selectedDateStr, entries);
        
        itemNameInput.value = '';
        itemProfitInput.value = '';
        
        loadEntries();
    });

    function promptDelete(id) {
        itemToDeleteId = id;
        confirmModal.classList.add('active');
    }

    cancelDeleteBtn.addEventListener('click', () => {
        itemToDeleteId = null;
        confirmModal.classList.remove('active');
    });

    confirmDeleteBtn.addEventListener('click', () => {
        if (itemToDeleteId) {
            let entries = getEntriesByDate(selectedDateStr);
            entries = entries.filter(item => item.id !== itemToDeleteId);
            saveEntriesByDate(selectedDateStr, entries);
            itemToDeleteId = null;
            confirmModal.classList.remove('active');
            loadEntries();
        }
    });

    function loadEntries() {
        const entries = getEntriesByDate(selectedDateStr);
        
        itemList.innerHTML = '';
        let total = 0;

        if (entries.length === 0) {
            itemList.innerHTML = '<div class="empty-state">No entries for this date</div>';
            totalProfitEl.textContent = '$0.00';
            totalCardBox.classList.remove('loss-bg');
            totalCardTitle.textContent = "Selected Day's Total Profit";
            return;
        }

        entries.forEach(item => {
            total += item.profit;
            const isLoss = item.profit < 0;
            const classProfit = isLoss ? 'neg' : 'pos';
            const formattedProfit = isLoss ? `-$${Math.abs(item.profit).toFixed(2)}` : `$${item.profit.toFixed(2)}`;
            
            const li = document.createElement('li');
            li.className = 'item-card';

            // Fix 2: Prevent HTML Injection by using textContent for item name
            const titleDiv = document.createElement('div');
            const titleSpan = document.createElement('span');
            titleSpan.className = 'item-title';
            titleSpan.textContent = item.name;
            titleDiv.appendChild(titleSpan);

            const rightDiv = document.createElement('div');
            rightDiv.style.display = 'flex';
            rightDiv.style.alignItems = 'center';

            const profitSpan = document.createElement('span');
            profitSpan.className = `item-profit ${classProfit}`;
            profitSpan.textContent = formattedProfit;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '✕';
            deleteBtn.onclick = () => promptDelete(item.id);

            rightDiv.appendChild(profitSpan);
            rightDiv.appendChild(deleteBtn);

            li.appendChild(titleDiv);
            li.appendChild(rightDiv);

            itemList.appendChild(li);
        });

        if (total < 0) {
            totalCardBox.classList.add('loss-bg');
            totalCardTitle.textContent = "Selected Day's Total Loss";
            totalProfitEl.textContent = `-$${Math.abs(total).toFixed(2)}`;
        } else {
            totalCardBox.classList.remove('loss-bg');
            totalCardTitle.textContent = "Selected Day's Total Profit";
            totalProfitEl.textContent = `$${total.toFixed(2)}`;
        }
    }

    // Initial Load
    updateSelectedDateDisplay();
    loadEntries();
</script>

</body>
</html>
